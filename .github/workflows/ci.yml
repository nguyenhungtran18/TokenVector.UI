name: ci-static

# Phase 12.3: static checks only — KHONG build tkvc (compiler machine-local,
# chi co tren dev box; xem tkvui.pkg.json toolchain + tools/verify.sh de chay
# full suite bang tay). Workflow nay bao: purity .tkv, JSON hop le, shell
# syntax, python syntax, powershell parse, docs relative-link.

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  purity-tkv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rule #0 — library paths pure .tkv only
        run: |
          python3 - <<'PYEOF'
          import os, sys
          bad = []
          # 1. Root: chi .tkv/.md/.json/.nuspec/.gitignore duoc phep ngoai tools/docs/examples/...
          keep_root_ext = ('.tkv', '.md', '.json', '.nuspec', '.gitignore')
          keep_root_names = ('LICENSE',)
          for fn in os.listdir('.'):
              if os.path.isdir(fn) or fn.startswith('.'):
                  continue
              if fn in keep_root_names:
                  continue
              if not fn.endswith(keep_root_ext):
                  bad.append('root non-tkv: ' + fn)
          # 2. examples/: chi .tkv + .md
          for fn in os.listdir('examples'):
              fp = os.path.join('examples', fn)
              if os.path.isdir(fp):
                  continue
              if not (fn.endswith('.tkv') or fn.endswith('.md')):
                  bad.append('examples non-tkv: ' + fn)
              # 3. Moi module TkvUI.*.tkv phai co selftest entry khai trong pkg
              import json
              d = json.load(open('tkvui.pkg.json'))
              have = {m['file'] for m in d['modules']}
              import glob
              for f in glob.glob('TkvUI.*.tkv'):
                  if f not in have:
                      bad.append('module chua dang ky pkg: ' + f)
          for b in bad:
              print('PURITY FAIL:', b)
          sys.exit(1 if bad else 0)
          print('PURITY_OK')
          PYEOF

  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tkvui.pkg.json
        run: python3 -c "import json; d=json.load(open('tkvui.pkg.json')); print('pkg', d['version'], 'modules:', len(d['modules']))"

  lint-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n (syntax only, khong chay)
        run: |
          fail=0
          for f in tools/*.sh; do
            bash -n "$f" || { echo "SYNTAX FAIL: $f"; fail=1; }
          done
          exit $fail

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: py_compile bench + tool scripts
        run: |
          python3 -m py_compile tools/bench/*.py tools/*.py 2>/dev/null || \
          python3 -m py_compile tools/bench/*.py

  lint-powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse .ps1 (neu co pwsh; khong co thi skip)
        shell: bash
        run: |
          if ! command -v pwsh >/dev/null 2>&1; then
            echo "SKIP: khong co pwsh tren runner"
            exit 0
          fi
          fail=0
          for f in tools/*.ps1; do
            pwsh -NoProfile -Command "
              \$e = \$null
              [void][System.Management.Automation.Language.Parser]::ParseFile('$f', [ref]\$null, [ref]\$e)
              if (\$e.Count -gt 0) { \$e | ForEach-Object { Write-Host \$_ }; exit 1 }
            " || { echo "PARSE FAIL: $f"; fail=1; }
          done
          exit $fail

  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Relative links trong docs/ + *.md phai ton tai
        run: |
          python3 - <<'PYEOF'
          import re, os, sys
          bad = []
          for root, _, files in os.walk('.'):
              if '.git' in root:
                  continue
              if root.startswith(('./build', './dist', 'build', 'dist')):
                  continue
              for fn in files:
                  if not fn.endswith('.md'):
                      continue
                  p = os.path.join(root, fn)
                  s = open(p, encoding='utf-8').read()
                  for m in re.finditer(r'\[(?:[^\]]*)\]\(([^)#\s]+)\)', s):
                      t = m.group(1)
                      if t.startswith(('http://', 'https://', 'mailto:', '#')):
                          continue
                      full = os.path.normpath(os.path.join(root, t))
                      if not os.path.exists(full):
                          bad.append(f'{p}: {t}')
              for b in bad:
                  print('DEAD LINK:', b)
              sys.exit(1 if bad else 0)
          PYEOF

  # =========================================================
  # Phase 12.3: CI Matrix (Win + Ubuntu + WASM)
  # =========================================================
  verify-matrix:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: wasm
            rust-toolchain: stable
          - os: windows-latest
            target: win32
            rust-toolchain: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust (for WASM target)
        if: matrix.target == 'wasm'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust-toolchain }}
          target: wasm32-wasi
      - name: Install tkvc (Windows)
        if: runner.os == 'Windows'
        run: |
          # tkvc.exe should be available in PATH or cached
          echo "TKVC_PATH=$TKVC" >> $GITHUB_ENV
      - name: Install tkvc (Linux)
        if: runner.os == 'Linux'
        run: |
          # Check if tkvc exists or build from source
          echo "TKVC not pre-installed on Linux runner, skipping tkvc build"
      - name: Run purity check
        run: |
          python3 - <<'PYEOF'
          import os, sys, json, glob
          bad = []
          keep_root_ext = ('.tkv', '.md', '.json', '.nuspec', '.gitignore')
          keep_root_names = ('LICENSE',)
          for fn in os.listdir('.'):
              if os.path.isdir(fn) or fn.startswith('.'):
                  continue
              if fn in ('LICENSE',):
                  continue
              if not fn.endswith(('.tkv', '.md', '.json', '.nuspec', '.gitignore')):
                  bad.append('root non-tkv: ' + fn)
          for fn in os.listdir('examples'):
              fp = os.path.join('examples', fn)
              if os.path.isdir(fp):
                  continue
              if not (fn.endswith('.tkv') or fn.endswith('.md')):
                  bad.append('examples non-tkv: ' + fn)
          import json, glob
          d = json.load(open('tkvui.pkg.json'))
          have = {m['file'] for m in d['modules']}
          for f in glob.glob('TkvUI.*.tkv'):
              if f not in have:
                  bad.append('module chua dang ky pkg: ' + f)
          for b in bad:
              print('PURITY FAIL:', b)
          sys.exit(1 if bad else 0)
          print('PURITY_OK')
          PYEOF
      - name: Validate tkvui.pkg.json
        run: python3 -c "import json; d=json.load(open('tkvui.pkg.json')); print('pkg', d['version'], 'modules:', len(d['modules']))"
      - name: lint shell scripts
        run: |
          fail=0
          for f in tools/*.sh; do
            bash -n "$f" || { echo "SYNTAX FAIL: $f"; fail=1; }
          done
          exit $fail
      - name: lint python scripts
        run: |
          python3 -m py_compile tools/bench/*.py tools/*.py 2>/dev/null || python3 -m py_compile tools/bench/*.py
      - name: lint powershell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fail=0
          foreach ($f in Get-ChildItem tools/*.ps1) {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$null, [ref]$e)
            if ($e.Count -gt 0) { $e | ForEach-Object { Write-Host $_ }; exit 1 }
          }
          exit $fail
      - name: Validate tkvui.pkg.json
        run: python3 -c "import json; d=json.load(open('tkvui.pkg.json')); print('pkg', d['version'], 'modules:', len(d['modules']))"
      - name: Check docs links
        run: |
          python3 - <<'PYEOF'
          import re, os, sys
          bad = []
          for root, _, files in os.walk('.'):
              if '.git' in root: continue
              if root.startswith(('./build', './dist', 'build', 'dist')): continue
              for fn in files:
                  if not fn.endswith('.md'): continue
                  p = os.path.join(root, fn)
                  s = open(p, encoding='utf-8').read()
                  for m in re.finditer(r'\[(?:[^\]]*)\]\(([^)#\s]+)\)', s):
                      t = m.group(1)
                      if t.startswith(('http://', 'https://', 'mailto:', '#')): continue
                      full = os.path.normpath(os.path.join(root, t))
                      if not os.path.exists(full):
                          bad.append(f'{p}: {t}')
          for b in bad: print('DEAD LINK:', b)
          sys.exit(1 if bad else 0)
          PYEOF